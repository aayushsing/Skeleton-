<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Skeleton Teaching</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
      color: white;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 12px;
      border-radius: 10px;
      max-width: 300px;
    }
    #boneList {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 10px;
      font-size: 14px;
    }
    button, select {
      margin: 5px 0;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #1e1e1e;
      color: white;
      cursor: pointer;
    }
    button:hover, select:hover {
      background: #444;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>🦴 Skeleton Teacher</h2>
    <label>Mode: </label>
    <select id="mode">
      <option value="easy">Easy (Main Bones)</option>
      <option value="hard">Hard (All 206 Bones)</option>
    </select>
    <br>
    <label>Language: </label>
    <select id="language">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
    </select>
    <br>
    <button id="speakBtn">🔊 Speak Selected</button>
    <div id="boneList"></div>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2a9e67.mp3?filename=soft-ambient-music-10962.mp3" type="audio/mpeg">
  </audio>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // === Bone Data (Full 206 Bones) ===
    const bones = {
      easy: [
        { en: "Skull", hi: "खोपड़ी" },
        { en: "Spine", hi: "रीढ़" },
        { en: "Rib Cage", hi: "पसलियां" },
        { en: "Pelvis", hi: "श्रोणि" },
        { en: "Arms", hi: "बांह" },
        { en: "Legs", hi: "टांग" },
        { en: "Hands", hi: "हाथ" },
        { en: "Feet", hi: "पैर" }
      ],
      hard: [
        // Skull (22)
        {en:"Frontal Bone", hi:"ललाट अस्थि"},
        {en:"Parietal Bone (L)", hi:"पार्श्व अस्थि (बायां)"},
        {en:"Parietal Bone (R)", hi:"पार्श्व अस्थि (दायां)"},
        {en:"Temporal Bone (L)", hi:"कर्ण अस्थि (बायां)"},
        {en:"Temporal Bone (R)", hi:"कर्ण अस्थि (दायां)"},
        {en:"Occipital Bone", hi:"पश्चकपाल अस्थि"},
        {en:"Sphenoid Bone", hi:"स्फेनॉइड अस्थि"},
        {en:"Ethmoid Bone", hi:"एथमॉइड अस्थि"},
        {en:"Nasal Bone (2)", hi:"नासिका अस्थि (2)"},
        {en:"Maxilla (2)", hi:"ऊपरी जबड़ा (2)"},
        {en:"Zygomatic Bone (2)", hi:"गाल की अस्थि (2)"},
        {en:"Palatine Bone (2)", hi:"तालु अस्थि (2)"},
        {en:"Lacrimal Bone (2)", hi:"अश्रु अस्थि (2)"},
        {en:"Inferior Nasal Concha (2)", hi:"निचली नासिका शंखिका (2)"},
        {en:"Vomer", hi:"वोमर"},
        {en:"Mandible", hi:"हनु"},
        // Ear (6)
        {en:"Malleus (2)", hi:"मैलियस (2)"},
        {en:"Incus (2)", hi:"इन्कस (2)"},
        {en:"Stapes (2)", hi:"स्टेप्स (2)"},
        // Hyoid
        {en:"Hyoid Bone", hi:"हायॉइड अस्थि"},
        // Vertebral Column (26)
        {en:"Cervical Vertebrae (7)", hi:"ग्रीवा कशेरुकाएँ (7)"},
        {en:"Thoracic Vertebrae (12)", hi:"वक्ष कशेरुकाएँ (12)"},
        {en:"Lumbar Vertebrae (5)", hi:"कटि कशेरुकाएँ (5)"},
        {en:"Sacrum", hi:"त्रिकास्थि"},
        {en:"Coccyx", hi:"पुच्छास्थि"},
        // Thorax (25)
        {en:"Sternum", hi:"उरोस्थि"},
        {en:"Ribs (24)", hi:"पसलियां (24)"},
        // Shoulder (4)
        {en:"Clavicle (2)", hi:"क्लैविकल (2)"},
        {en:"Scapula (2)", hi:"स्कैपुला (2)"},
        // Arms (60)
        {en:"Humerus (2)", hi:"भुजास्थि (2)"},
        {en:"Radius (2)", hi:"त्रिज्या अस्थि (2)"},
        {en:"Ulna (2)", hi:"अल्ना (2)"},
        {en:"Carpals (16)", hi:"कार्पल अस्थियाँ (16)"},
        {en:"Metacarpals (10)", hi:"मेटाकार्पल अस्थियाँ (10)"},
        {en:"Phalanges-Hand (28)", hi:"हाथ की ऊँगली अस्थियाँ (28)"},
        // Pelvis (2)
        {en:"Hip Bone (2)", hi:"श्रोणि अस्थि (2)"},
        // Legs (60)
        {en:"Femur (2)", hi:"जांघ की हड्डी (2)"},
        {en:"Patella (2)", hi:"घुटना अस्थि (2)"},
        {en:"Tibia (2)", hi:"टिबिया (2)"},
        {en:"Fibula (2)", hi:"फिबुला (2)"},
        {en:"Tarsals (14)", hi:"टार्सल अस्थियाँ (14)"},
        {en:"Metatarsals (10)", hi:"मेटाटार्सल अस्थियाँ (10)"},
        {en:"Phalanges-Foot (28)", hi:"पाँव की उंगलियां (28)"}
      ]
    };

    const boneList = document.getElementById("boneList");
    const modeSelect = document.getElementById("mode");
    const langSelect = document.getElementById("language");
    const speakBtn = document.getElementById("speakBtn");

    let selectedBone = null;

    function renderBoneList() {
      boneList.innerHTML = "";
      let mode = modeSelect.value;
      bones[mode].forEach((bone) => {
        const div = document.createElement("div");
        div.textContent = langSelect.value === "en" ? bone.en : bone.hi;
        div.style.cursor = "pointer";
        div.onclick = () => {
          selectedBone = bone;
          speakBone();
        };
        boneList.appendChild(div);
      });
    }

    function speakBone() {
      if (!selectedBone) return;
      let msg = new SpeechSynthesisUtterance(
        langSelect.value === "en" ? selectedBone.en : selectedBone.hi
      );
      msg.lang = langSelect.value === "en" ? "en-US" : "hi-IN";
      window.speechSynthesis.speak(msg);
    }

    modeSelect.onchange = renderBoneList;
    langSelect.onchange = renderBoneList;
    speakBtn.onclick = speakBone;

    renderBoneList();

    // === 3D Skeleton ===
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(light);

    const loader = new THREE.GLTFLoader();
    loader.load(
      "https://raw.githubusercontent.com/AayushSinghCodes/skeleton-model/main/skeleton.glb", 
      function(gltf) {
        let skeleton = gltf.scene;
        skeleton.scale.set(1.2,1.2,1.2);
        scene.add(skeleton);
      },
      undefined,
      function(error){ console.error(error); }
    );

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
